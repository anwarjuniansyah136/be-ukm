spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3100/pasim_mengaji?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta}
    username: ${SPRING_DATASOURCE_USERNAME:pasim}
    password: ${SPRING_DATASOURCE_PASSWORD:pasim_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false
server:
  port: ${PORT:8089}
  error:
    include-message: always
app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@pasim.ac.id}
    password: ${APP_ADMIN_PASSWORD:Admin12345678!}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-to-at-least-32-characters}
    expiration-hours: 24
